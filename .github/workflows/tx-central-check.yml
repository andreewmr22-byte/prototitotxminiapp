name: TX Central validation
on:
  pull_request:
    paths:
      - "central/**"
      - ".github/workflows/tx-central-check.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check script syntax
        run: node --check central/tests/validate.mjs
      - name: Run isolated Central TX checks
        run: node central/tests/validate.mjs
